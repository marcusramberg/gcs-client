name: 'Setup GCS Client'
description: 'Downloads and sets up the gcs-client binary'
inputs:
  version:
    description: 'Version of gcs-client to download'
    required: false
    default: 'v0.2.1'
  command:
    description: 'Optional gcs-client command to run (e.g., ls gs://bucket)'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Download and Run gcs-client
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        GCS_COMMAND: ${{ inputs.command }}
        GCS_VERSION: ${{ inputs.version }}
      run: |
        OS='unknown'
        case "$RUNNER_OS" in
          Linux) OS='linux' ;;
          Windows) OS='windows' ;;
          macOS) OS='darwin' ;;
        esac

        ARCH='unknown'
        case "$RUNNER_ARCH" in
          X64) ARCH='amd64' ;;
          ARM64) ARCH='arm64' ;;
        esac

        if [ "$OS" = "unknown" ] || [ "$ARCH" = "unknown" ]; then
          echo "Error: Failed to detect OS ($RUNNER_OS) or architecture ($RUNNER_ARCH)"
          exit 1
        fi

        INSTALL_DIR="$HOME/.gcs-client/bin"

        # Determine binary name
        if [ "$OS" = "windows" ]; then
          FINAL_BINARY="$INSTALL_DIR/gcs-client.exe"
        else
          FINAL_BINARY="$INSTALL_DIR/gcs-client"
        fi

        if [ ! -f "$FINAL_BINARY" ]; then
          BINARY_NAME="gcs-client-$OS-$ARCH"
          if [ "$OS" = "windows" ]; then
            BINARY_NAME="$BINARY_NAME.exe"
          fi

          URL="https://github.com/marcusramberg/gcs-client/releases/download/$GCS_VERSION/$BINARY_NAME"
          echo "Downloading $URL..."
          curl -L -o "$BINARY_NAME" "$URL"
          chmod +x "$BINARY_NAME"

          mkdir -p "$INSTALL_DIR"
          mv "$BINARY_NAME" "$FINAL_BINARY"
        else
          echo "gcs-client already installed at $FINAL_BINARY"
        fi

        if [ -n "$GCS_COMMAND" ]; then
          echo "Running command: gcs-client $GCS_COMMAND"
          "$FINAL_BINARY" $GCS_COMMAND
        else
          # Ensure it's only added to PATH once
          if [[ ":$PATH:" != *":$INSTALL_DIR:"* ]]; then
             echo "$INSTALL_DIR" >> $GITHUB_PATH
          fi
        fi
